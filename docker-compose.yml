services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace
    working_dir: /workspace
    depends_on:
      - spark-master
    command: sleep infinity

  spark-master:
    image: apache/spark:4.0.0-scala2.13-java17-ubuntu
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "-h", "spark-master"]
    environment:
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - 8080:8080
      - 7077:7077

  # The worker reads the dataset and writes the models, so it sees the same /workspace as dev
  spark-worker:
    image: apache/spark:4.0.0-scala2.13-java17-ubuntu
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    user: root
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    depends_on:
      - spark-master
    ports:
      - 8081:8081
    volumes:
      - .:/workspace
