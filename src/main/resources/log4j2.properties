# Définit le niveau global à WARN pour ne plus voir les INFO
rootLogger.level = INFO
rootLogger.appenderRefs = stdout, file
rootLogger.appenderRef.stdout.ref = STDOUT
rootLogger.appenderRef.file.ref = LogFile

# Configuration pour la console (Terminal)
appender.stdout.type = Console
appender.stdout.name = STDOUT
appender.stdout.layout.type = PatternLayout
appender.stdout.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n

# Configuration pour le fichier
appender.file.type = File
appender.file.name = LogFile
appender.file.fileName = logs/spark-execution.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %p %c{1}: %m%n